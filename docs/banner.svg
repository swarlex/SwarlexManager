    <text class="m" x="784" y="157" font-size="14" xml:space="preserve"><tspan fill="#F2F2F2">             S W A R L E X</tspan></text>
    <text class="m" x="784" y="220" font-size="14" xml:space="preserve"><tspan fill="#16C60C">●</tspan><tspan fill="#CCCCCC"> Vencord    : </tspan><tspan fill="#16C60C">Patched</tspan></text>
    <text class="m" x="784" y="241" font-size="14" xml:space="preserve"><tspan fill="#16C60C">●</tspan><tspan fill="#CCCCCC"> Spicetify  : </tspan><tspan fill="#16C60C">Applied</tspan></text>
    <text class="m" x="784" y="262" font-size="14" xml:space="preserve"><tspan fill="#16C60C">●</tspan><tspan fill="#CCCCCC"> Millennium : </tspan><tspan fill="#16C60C">Active</tspan></text>
    <text class="m" x="784" y="283" font-size="14" xml:space="preserve"><tspan fill="#F9F1A5">●</tspan><tspan fill="#CCCCCC"> App Updates: </tspan><tspan fill="#F9F1A5">3 waiting</tspan></text>
    <text class="m" x="784" y="325" font-size="14" xml:space="preserve"><tspan fill="#CCCCCC">[</tspan><tspan fill="#E74856">6</tspan><tspan fill="#CCCCCC">] </tspan><tspan fill="#E74856">Repair</tspan><tspan fill="#CCCCCC">   [</tspan><tspan fill="#16C60C">5</tspan><tspan fill="#CCCCCC">] </tspan><tspan fill="#B4009E">Backup</tspan><tspan fill="#CCCCCC">   [</tspan><tspan fill="#F9F1A5">7</tspan><tspan fill="#CCCCCC">] </tspan><tspan fill="#F9F1A5">Settings</tspan></text>
