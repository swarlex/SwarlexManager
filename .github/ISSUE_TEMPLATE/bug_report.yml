name: Bug report
description: Something in Swarlex Manager does not work as it should
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for taking the time to report this. The two pastes below answer most questions up front.
  - type: textarea
    id: what
    attributes:
      label: What happened?
      description: What did you do, what did you expect, and what happened instead?
      placeholder: "Discord > [1] Patch Discord stopped with ..."
    validations:
      required: true
  - type: textarea
    id: sysinfo
    attributes:
      label: System info
      description: In Swarlex open **Settings > [7] System Info**, press **C** and paste it here.
      render: text
    validations:
      required: true
  - type: textarea
    id: log
    attributes:
      label: Log excerpt
      description: |
        **Settings > [6] Log File** opens `swarlex.log`. Paste the lines from around the time it went wrong.
        Check the paste for anything you would rather not share first.
      render: text
  - type: textarea
    id: screenshot
    attributes:
      label: Screenshot
      description: A screenshot of the Swarlex window often says more than words. Drag it in here.
