<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="420" viewBox="0 0 1280 420" role="img" aria-label="Swarlex Manager - one control center for Vencord, Spicetify and Millennium">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#0B0F1A"/><stop offset="1" stop-color="#0E1424"/></linearGradient>
    <radialGradient id="g1" cx="0.12" cy="0.1" r="0.55"><stop offset="0" stop-color="#5865F2" stop-opacity=".45"/><stop offset="1" stop-color="#5865F2" stop-opacity="0"/></radialGradient>
    <radialGradient id="g2" cx="0.5" cy="1.05" r="0.5"><stop offset="0" stop-color="#1DB954" stop-opacity=".30"/><stop offset="1" stop-color="#1DB954" stop-opacity="0"/></radialGradient>
    <radialGradient id="g3" cx="0.95" cy="0.2" r="0.5"><stop offset="0" stop-color="#66C0F4" stop-opacity=".32"/><stop offset="1" stop-color="#66C0F4" stop-opacity="0"/></radialGradient>
