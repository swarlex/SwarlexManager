name: Release

# Pushing a tag like v1.2.0 publishes Swarlex-Manager.bat and its SHA-256 as a GitHub release.
# Installed copies of Swarlex find it through the GitHub API and offer the update.
on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Tag must match SWX_VERSION in the script
        run: |
          tag="${GITHUB_REF_NAME#v}"
          ver="$(grep -oP '^set "SWX_VERSION=\K[0-9][0-9.]*' Swarlex-Manager.bat)"
          echo "tag=$tag script=$ver"
          if [ "$tag" != "$ver" ]; then
            echo "::error::Tag $GITHUB_REF_NAME does not match SWX_VERSION=$ver in Swarlex-Manager.bat"
            exit 1
          fi

      - name: Script must keep Windows line endings
        run: |
          if ! grep -q $'\r$' Swarlex-Manager.bat; then
            echo "::error::Swarlex-Manager.bat lost its CRLF line endings"
            exit 1
          fi

      - name: Checksum
        run: sha256sum Swarlex-Manager.bat > Swarlex-Manager.bat.sha256 && cat Swarlex-Manager.bat.sha256

      - name: Release notes from CHANGELOG.md
        run: |
          tag="${GITHUB_REF_NAME#v}"
          awk -v v="$tag" '/^## \[/ { p = index($0, "[" v "]") > 0; next } p' CHANGELOG.md > notes.md
          if [ ! -s notes.md ]; then echo "Swarlex Manager $GITHUB_REF_NAME" > notes.md; fi
          {
            echo
            echo "**SHA-256:** \`$(cut -d' ' -f1 Swarlex-Manager.bat.sha256)\`"
          } >> notes.md
          cat notes.md

      - name: Publish
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" Swarlex-Manager.bat Swarlex-Manager.bat.sha256 \
            --title "Swarlex Manager $GITHUB_REF_NAME" --notes-file notes.md

      - name: Refresh the README badges
        # GitHub caches README images. Wait until shields.io reports the new release (its own cache is
        # 10 minutes), then purge GitHub's copies so the release and downloads badges show it at once.
        run: |
          badge="https://img.shields.io/github/v/release/${GITHUB_REPOSITORY}?label=release&color=3fb950&cacheSeconds=600"
          for i in $(seq 1 26); do
            if curl -fsS "$badge" | grep -q ">${GITHUB_REF_NAME}<"; then echo "shields.io shows $GITHUB_REF_NAME"; break; fi
            sleep 30
          done
          curl -fsS "https://github.com/${GITHUB_REPOSITORY}" | grep -o 'https://camo.githubusercontent.com/[^"\]*' | sort -u |
            while read -r u; do curl -fsS -X PURGE "$u" > /dev/null && echo "purged $u"; done
