    <linearGradient id="title" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#FFFFFF"/><stop offset="1" stop-color="#B9C6FF"/></linearGradient>
    <pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse"><path d="M32 0H0V32" fill="none" stroke="#FFFFFF" stroke-opacity=".045"/></pattern>
    <filter id="sh" x="-20%" y="-20%" width="140%" height="150%"><feDropShadow dx="0" dy="14" stdDeviation="18" flood-color="#000" flood-opacity=".5"/></filter>
    <clipPath id="clip"><rect width="1280" height="420" rx="18"/></clipPath>
  </defs>
  <style>.s{font-family:&quot;Segoe UI Variable Display&quot;,&quot;Segoe UI&quot;,system-ui,-apple-system,&quot;Helvetica Neue&quot;,Arial,sans-serif}.m{font-family:&quot;Cascadia Mono&quot;,&quot;Cascadia Code&quot;,Consolas,&quot;SF Mono&quot;,Menlo,&quot;DejaVu Sans Mono&quot;,monospace;white-space:pre}</style>
